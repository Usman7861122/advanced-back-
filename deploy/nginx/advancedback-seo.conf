# Put these inside the HTTPS server { } block for advancedback.com (see deploy/README.md).
# Needs /etc/nginx/snippets/advancedback-security.conf (deploy/nginx/security-headers.conf).

root /var/www/advancedback;
index index.html;
error_page 404 /404.html;

# ---- Redirects (301) ----
# Old WordPress sitemap name -> new sitemap
location = /sitemap_index.xml { return 301 /sitemap-index.xml; }
# Old About address -> real About page
location ~ ^/about/?$ { return 301 /about-practice/; }
# Old typo address of the topical pain relievers post
location ~* ^/newark-chiropractor-talks-5-best-natural-pain-relievers-.*bruising-muscle-soreness { return 301 /newark-chiropractor-talks-5-best-natural-pain-relievers-topical-options-that-actually-work/; }

# ---- Old WordPress addresses: 410 Gone ----
location ~* ^/(wp-admin|wp-login\.php|wp-json|wp-content|wp-includes|xmlrpc\.php)(/|$) { return 410; }
location ~* /feed/?$ { return 410; }

# ---- Caching ----
# Files with a hash in the name never change: cache for one year.
location ^~ /_astro/ { expires 1y; add_header Cache-Control "public, max-age=31536000, immutable"; include snippets/advancedback-security.conf; }
location ~ ^/(video/hero-[0-9a-f]{8}\.(mp4|webm)|images/hero-poster-[0-9a-f]{8}\.webp)$ { expires 1y; add_header Cache-Control "public, max-age=31536000, immutable"; include snippets/advancedback-security.conf; }
# Other images, video, fonts and PDFs: 30 days.
location ~* \.(?:webp|jpe?g|png|gif|svg|ico|mp4|webm|woff2|pdf)$ { expires 30d; add_header Cache-Control "public, max-age=2592000"; include snippets/advancedback-security.conf; }
# Pages and everything else: 5 minutes, so edits show up fast.
location / {
  try_files $uri $uri/ =404;
  add_header Cache-Control "public, max-age=300";
  include snippets/advancedback-security.conf;
}
