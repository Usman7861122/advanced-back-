# Save as /etc/nginx/snippets/advancedback-security.conf
# Included in every location that sets its own add_header (nginx drops inherited headers otherwise).
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# Report-Only first: it logs problems in the browser console but blocks nothing.
# Check the console on the main pages for a week, fix anything flagged, then rename to Content-Security-Policy.
add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'unsafe-inline' https://api.ironhealthsolutions.com https://widgets.leadconnectorhq.com https://www.youtube.com https://www.youtube-nocookie.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://i.ytimg.com https://*.googleapis.com https://*.gstatic.com https://api.ironhealthsolutions.com https://*.leadconnectorhq.com; font-src 'self' data:; media-src 'self'; frame-src https://www.youtube.com https://www.youtube-nocookie.com https://www.google.com https://api.ironhealthsolutions.com https://*.leadconnectorhq.com; connect-src 'self' https://api.ironhealthsolutions.com https://*.leadconnectorhq.com; object-src 'none'; base-uri 'self'; form-action 'self' https://api.ironhealthsolutions.com" always;
