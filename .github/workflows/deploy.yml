name: Deploy to S3

# Runs on every push to main. Builds the Astro site and syncs dist/ to the S3 bucket.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: true

env:
  S3_BUCKET: advanced-back-website
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npx astro build

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # 1) Hashed assets: cache for one year
      - name: Upload hashed assets
        run: aws s3 sync dist/_astro "s3://$S3_BUCKET/_astro" --cache-control "public,max-age=31536000,immutable" --delete

      # 2) Everything else (HTML, images, forms): short cache so edits show up fast
      - name: Upload pages and files
        run: aws s3 sync dist "s3://$S3_BUCKET" --exclude "_astro/*" --cache-control "public,max-age=300" --delete

      # 3) Optional: clear CloudFront cache if you add a distribution id as a repo variable
      - name: Invalidate CloudFront
        if: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID != '' }}
        run: aws cloudfront create-invalidation --distribution-id "${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}" --paths "/*"
